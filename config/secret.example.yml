safework:
  ai:
    chat:
      # 方案一（推荐，AI 智能体需要支持 Function Calling 的模型）：DeepSeek，platform.deepseek.com → API Keys
      # 去掉下面三行开头的 #，填入 Key，然后删除方案二的 api-key、model 两行
      # base-url: https://api.deepseek.com/v1
      # api-key: "sk-xxxx"
      # model: deepseek-chat
      # 方案二：讯飞开放平台 → 控制台 → Spark Lite → HTTP 服务接口认证信息 → APIPassword
      api-key: ""
      model: lite
    embedding:
      # 阿里云百炼 → API-KEY 管理，形如 sk-xxxx
      api-key: ""
