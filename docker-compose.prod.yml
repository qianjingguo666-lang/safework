# 生产环境：一条命令启动 MySQL、Redis、后端、前端（Nginx）
# 使用前：复制 .env.example 为 .env 并修改里面的密码
# 启动：docker compose -f docker-compose.prod.yml up -d --build
name: safework-prod

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
      # 只创建空数据库，表结构由后端启动时的 Flyway 自动创建、升级（见 safework-server/src/main/resources/db/migration）
      MYSQL_DATABASE: safework
    # 小内存服务器：限制缓冲池、关闭性能统计，MySQL 能少用几百 MB 内存
    command: >
      --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
      --innodb-buffer-pool-size=256M --performance-schema=OFF
    volumes:
      - mysql-data:/var/lib/mysql
    # 不映射端口：数据库只允许容器内部访问，公网连不上
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      --appendonly yes --maxmemory 128mb --maxmemory-policy volatile-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: safework-backend:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 生产配置：验证码答案不会返回给前端（application-prod.yml）
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-https://api.deepseek.com}
      AI_CHAT_API_KEY: ${AI_CHAT_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-deepseek-chat}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      AI_ASR_APP_ID: ${AI_ASR_APP_ID:-}
      AI_ASR_API_KEY: ${AI_ASR_API_KEY:-}
      AI_ASR_API_SECRET: ${AI_ASR_API_SECRET:-}
      # 演示模式（公开演示站才打开）
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_AI_DAILY_LIMIT: ${DEMO_AI_DAILY_LIMIT:-200}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseG1GC}
      # 生产环境不打印 SQL，日志级别改为 info
      LOGGING_LEVEL_COM_SAFEWORK: info
    # 上传的附件（现场照片）存在这个数据卷里，重新部署不会丢
    volumes:
      - upload-data:/app/data
      - backend-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./safework-web
    image: safework-web:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
  upload-data:
  backend-logs:
