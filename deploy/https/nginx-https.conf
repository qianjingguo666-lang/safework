# 80 端口：所有 http 访问都跳转到 https
server {
    listen 80;
    server_name _;
    location / {
        return 301 https://qianjingguo.asia$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name qianjingguo.asia www.qianjingguo.asia;

    ssl_certificate     /etc/letsencrypt/live/qianjingguo.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qianjingguo.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /api/actuator/ {
        return 404;
    }
    location = /api/actuator/health {
        proxy_pass http://backend:8080/actuator/health;
    }
}
