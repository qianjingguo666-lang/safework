server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: safework
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地默认连 docker-compose 起的 MySQL（映射到 3307，避免和你电脑上已有的 MySQL 冲突）
    # 部署到服务器时用环境变量覆盖，不改代码
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:safework}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:safework123}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: 0
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  # 前端请求头：Authorization: Bearer xxx
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  is-print: false

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.safework: debug
