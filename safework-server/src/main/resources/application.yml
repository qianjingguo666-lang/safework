server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: safework
  # 默认使用开发环境配置（application-dev.yml）；服务器上 docker-compose.prod.yml 会设置 SPRING_PROFILES_ACTIVE=prod
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # GET 请求里的时间参数（如日志查询的开始、结束时间）按这个格式解析
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss
      date: yyyy-MM-dd
  # API Key 等密钥放在项目根目录的 config/secret.yml（已加入 .gitignore，不会提交到 GitHub）
  config:
    import: optional:file:./config/secret.yml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地默认连 docker-compose 起的 MySQL（映射到 3307，避免和你电脑上已有的 MySQL 冲突）
    # 部署到服务器时用环境变量覆盖，不改代码
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:safework}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:safework123}
  # 数据库版本管理：启动时按版本号执行 db/migration 下还没执行过的脚本
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 以前手动导入过 init.sql 和 v2~v4 升级脚本的数据库（有表但没有 Flyway 记录）：
    # 第一次启动时标记为第 4 版，只执行 V5 及以后的脚本；全新的空数据库会从 V1 开始执行
    baseline-on-migrate: true
    baseline-version: 4
    baseline-description: 手动导入的 init.sql + v2~v4
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: 0
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  # 前端请求头：Authorization: Bearer xxx
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  is-print: false

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.safework: info
  # 每行日志带上 traceId：同一个请求的所有日志用同一个编号，出问题时按编号搜索
  pattern:
    level: "%5p [%X{traceId:-}]"

# ============ 接口文档 ============
# 开发环境打开 http://localhost:8080/swagger-ui.html；生产环境在 application-prod.yml 里关闭
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # 记住填过的 token，刷新页面不用重新填
    persist-authorization: true
    tags-sorter: alpha

# ============ 登录安全 ============
safework:
  security:
    # 图形验证码
    captcha-enabled: true
    # 开发环境返回验证码答案给测试脚本：这里是 false，只在 application-dev.yml 里打开
    captcha-debug: false
    captcha-expire-seconds: 120
    # 15 分钟内连续输错 5 次密码，锁定 15 分钟
    max-fail-count: 5
    fail-window-minutes: 15
    lock-minutes: 15

  # ============ 附件 ============
  file:
    # 本地存储目录（Docker 里挂载了数据卷 upload-data）
    local-path: ${FILE_LOCAL_PATH:./data/uploads}
    max-size-mb: 10
    max-count-per-biz: 9

  # ============ 定时任务 ============
  job:
    # 关闭后不会自动执行，平台【定时任务】页面仍然可以手动执行
    enabled: ${JOB_ENABLED:true}
    # 覆盖默认执行时间，例如：
    # cron:
    #   hazard-deadline: "0 0 9 * * *"
    login-log-days: 180
    read-message-days: 90
    job-log-days: 30

  # ============ 演示模式 ============
  # 把演示站地址公开给别人自测时打开（DEMO_MODE=true）：演示企业禁止改密码、停用账号、发全员公告等，
  # AI 按企业每天限额；数据每天由服务器上的 demo-reset.sh 恢复（见 docs/deploy.md）
  demo:
    enabled: ${DEMO_MODE:false}
    tenant-codes: [demo, test]
    ai-daily-limit: ${DEMO_AI_DAILY_LIMIT:200}
    reset-time: "04:00"
    password: admin123
    accounts:
      - { label: 企业管理员, tenant-code: demo, username: admin, tip: 看全部功能：数据看板、审批流程配置、AI 知识库 }
      - { label: 安全员, tenant-code: demo, username: zhangsan, tip: 审批作业票、指派和验收隐患、AI 预审 }
      - { label: 作业负责人, tenant-code: demo, username: lisi, tip: 申请作业票（手写签名）、语音上报隐患 }
      - { label: 监护人, tenant-code: demo, username: zhaoliu, tip: 现场复测气体、签名开工和完工 }

# ============ AI 助手 ============
# 不配置 api-key 也能运行：没有对话模型时只返回检索到的原文；没有向量模型时只用关键词检索
  ai:
    # 每人每分钟最多提问次数（控制大模型调用成本）
    rate-limit-per-minute: 10
    chat:
      # 讯飞星火（OpenAI 兼容接口），api-key 填控制台的 APIPassword
      base-url: ${AI_CHAT_BASE_URL:https://spark-api-open.xf-yun.com/v1}
      api-key: ${AI_CHAT_API_KEY:}
      model: ${AI_CHAT_MODEL:lite}
      temperature: 0.3
      timeout-seconds: 60
    embedding:
      # 阿里云百炼向量模型（OpenAI 兼容接口）
      base-url: ${AI_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${AI_EMBEDDING_API_KEY:}
      model: ${AI_EMBEDDING_MODEL:text-embedding-v3}
      dimensions: 1024
      batch-size: 10
    rag:
      chunk-size: 500
      chunk-overlap: 80
      top-k: 4
      # 低于这个分数认为没检索到，直接回答“知识库里没有”，不让模型瞎编
      min-score: 0.25
    # 语音转文字：讯飞开放平台「语音听写（流式版）」，控制台 → 我的应用 → 语音听写 → APPID、APIKey、APISecret
    # 不配置也能用：语音上报隐患页面可以直接打字（手机输入法自带的语音输入也行）
    asr:
      host-url: ${AI_ASR_HOST_URL:wss://iat-api.xfyun.cn/v2/iat}
      app-id: ${AI_ASR_APP_ID:}
      api-key: ${AI_ASR_API_KEY:}
      api-secret: ${AI_ASR_API_SECRET:}
