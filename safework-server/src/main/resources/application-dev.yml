# 开发环境（本机运行时默认生效）
safework:
  security:
    # 获取验证码时把答案一起返回，测试脚本（test-*.ps1）靠它自动登录。生产环境绝对不能打开
    captcha-debug: true
  # 开发环境登录页也列出账号（含平台管理员），方便切换；演示模式本身不打开
  demo:
    show-accounts: true
    accounts:
      - { label: 企业管理员, tenant-code: demo, username: admin, tip: 全部功能 }
      - { label: 安全员, tenant-code: demo, username: zhangsan, tip: 审批、验收 }
      - { label: 作业负责人, tenant-code: demo, username: lisi, tip: 申请、上报 }
      - { label: 监护人, tenant-code: demo, username: zhaoliu, tip: 开工、完工 }
      - { label: 平台管理员, tenant-code: platform, username: admin, tip: 开通企业、套餐 }

logging:
  level:
    com.safework: debug
