server {
    listen 80;
    server_name _;

    # 知识库上传文件最大 20MB，和后端配置一致
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;

    # 前端用的是 history 路由（/ticket/list 这种地址），刷新页面时要回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，保证发布新版本后用户立刻拿到新页面
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 打包后的 js/css 文件名带哈希，可以放心长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # /api/xxx 转发到后端 /xxx（末尾的 / 会去掉 /api 前缀，和开发时 Vite 代理的行为一致）
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 每个请求一个编号，后端日志、错误提示里都会带上，方便排查
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 流式回答（SSE）：关闭缓冲，否则 Nginx 会攒满一块才发给浏览器，就看不到逐字输出了
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 后端的监控接口只开放健康检查
    location /api/actuator/ {
        return 404;
    }
    location = /api/actuator/health {
        proxy_pass http://backend:8080/actuator/health;
    }
}
